name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build plugin
        run: mvn -B -ntp package

      - name: Verify jar contents
        run: |
          unzip -l target/ChosenOne.jar
          unzip -l target/ChosenOne.jar | grep -q "plugin.yml"
          unzip -l target/ChosenOne.jar | grep -q "com/example/chosenone/ChosenOne.class"

      - uses: actions/upload-artifact@v4
        with:
          name: ChosenOne
          path: target/ChosenOne.jar
          if-no-files-found: error
