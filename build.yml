name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show repo files
        run: |
          echo "=== repo root ==="
          ls -la
          echo "=== all files ==="
          find . -type f -not -path "./.git/*"

      - name: Check layout
        run: |
          test -f pom.xml || { echo "ERROR: pom.xml is not in the repo root"; exit 1; }
          test -f src/main/java/com/example/chosenone/ChosenOne.java || { echo "ERROR: ChosenOne.java is not at src/main/java/com/example/chosenone/"; exit 1; }
          test -f src/main/resources/plugin.yml || { echo "ERROR: plugin.yml is not at src/main/resources/plugin.yml"; exit 1; }
          echo "Layout OK"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build plugin
        run: mvn -B -ntp package

      - name: Verify jar contents
        run: |
          unzip -l target/ChosenOne.jar
          unzip -l target/ChosenOne.jar | grep -q "plugin.yml"
          unzip -l target/ChosenOne.jar | grep -q "com/example/chosenone/ChosenOne.class"

      - uses: actions/upload-artifact@v4
        with:
          name: ChosenOne
          path: target/ChosenOne.jar
          if-no-files-found: error
